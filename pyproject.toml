[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "battlegrounds-simulator"
version = "0.1.0"
description = "A deterministic four-player auto-battler simulation engine"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
battlegrounds-sim = "battlegrounds_engine.cli:main"

[tool.setuptools.packages.find]
include = ["battlegrounds_engine*"]
exclude = ["data*", "docs*", "teams*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
